# Parâmetros do pipeline de coleta.

# Devices de câmera — lido pelo launch (data_collection.launch.py). Precisa do
# `ros__parameters:` mesmo não sendo um nó de verdade: o parser de params do
# ROS exige essa estrutura em TODO bloco do arquivo, não só no que cada nó usa
# — sem isso o arquivo inteiro falha ao carregar (derruba episode_recorder e
# home_mover juntos). As 2 C270 andam desconectando/reconectando sozinhas
# (cabo/hub com mau contato) e trocando de porta USB quando isso acontece — se
# a gravação vier com a câmera errada, confere:
#   ls -l /dev/v4l/by-path/
# e tira uma foto de teste de cada video antes de editar aqui.
# Última checagem: 2026-09-11 — usb-0:4 = pulso ESQUERDO,
# usb-0:10.4 = pulso DIREITO (vê o caderno Sicredi).
cameras:
  ros__parameters:
    chest_camera: realsense        # realsense | v4l2
    # v4l2 (YUYV) medido em ~3-4ms de atraso (camera->topico); usb_cam (MJPG)
    # tem um bug de buffering interno que prende ~440-820ms de atraso fixo
    # por camera (confirmado isolando com V4L2 puro, sem ROS: o kernel/USB
    # entrega o frame na hora, o atraso e' introduzido pelo no' usb_cam).
    # As 2 C270 juntas em YUYV nao mostraram tearing nem perda de fps num
    # teste de 12s (~28Hz cada) -- mas isso foi com cena estatica; observar
    # tearing durante movimento real antes de confiar 100%.
    wrist_driver: v4l2             # v4l2 (YUYV, recomendado) | usb_cam (MJPG, ~500-800ms de atraso -- bug conhecido)
    chest_serial: ""                # vazio = aceita a RealSense que tiver conectada
    chest_device: "/dev/video12"
    left_wrist_device: "/dev/video4"
    right_wrist_device: "/dev/video6"

# Alinhamento do referencial do VR com o do robô — lido pelo launch, igual ao
# bloco `cameras:` acima. O bimanual_teleop transforma toda pose do Quest pra
# openarm_body_link0 passando por aqui; sem esta TF ele não sai do lugar e só
# emite um warn com throttle de 2s ("Falha ao transformar pose VR").
#
# Pai = `world` de propósito, não o base_link: a origem do XR é um lugar físico
# da sala. Como a junta world->openarm_body_link0 é fixa com origem identidade,
# hoje os dois dariam o mesmo número — a diferença só aparece se o robô for
# remontado deslocado, e aí `world` é que continua certo.
#
# xr_tf:=false no launch quando já houver outro publisher deste par de frames:
# dois publishers do mesmo par em /tf_static conflitam.
xr_tf:
  ros__parameters:
    parent_frame: world
    child_frame: xr_local
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

episode_recorder:
  ros__parameters:
    task_name: ""
    # `arm` NÃO fica aqui: vem do argumento `arm:=both|left|right` do launch, que
    # repassa o mesmo valor ao recorder, ao teleop e ao home_mover (default both).
    #
    # `{arm_tag}` vira bimanual | left_arm | right_arm conforme o `arm`, então cada
    # tipo de dataset tem o próprio diretório: both continua em
    # ~/datasets/openarm_bimanual_vr (o de sempre) e `arm:=right` grava em
    # ~/datasets/openarm_right_arm_vr, sem colidir com o bimanual. Um dataset_root
    # explícito no CLI sem a marca vale como veio (e o writer recusa um dataset de
    # schema diferente em vez de gravar por cima).
    dataset_root: "~/datasets/openarm_{arm_tag}_vr"
    repo_id: "furg/openarm_{arm_tag}_vr"
    fps: 30

    image_height: 480
    image_width: 640
    min_episode_frames: 15
    sync_slop: 0.033
    cameras_compressed: false

    # unidades gravadas. 1.0 = radianos (como o /joint_states publica).
    # Para gravar em graus (convenção do OpenArm LeRobot CAN): 57.29578
    arm_angle_scale: 1.0
    gripper_scale: 1.0
    gripper_offset: 0.0

    # juntas dos braços no /joint_states e nos comandos dos controllers
    left_arm_joint_names:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    right_arm_joint_names:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    left_gripper_joint_name: openarm_left_finger_joint1
    right_gripper_joint_name: openarm_right_finger_joint1

    cam_chest_topic: /cam_chest/color/image_raw
    left_wrist_topic: /left_wrist/image_raw
    right_wrist_topic: /right_wrist/image_raw

    # Braço: Float64MultiArray do forward_position_controller (é o que o
    # bimanual_teleop publica). Garra: controller_state, que expõe o setpoint
    # independente de o goal ter chegado por action (teleop) ou tópico.
    left_arm_cmd_topic: /left_forward_position_controller/commands
    right_arm_cmd_topic: /right_forward_position_controller/commands
    left_gripper_cmd_topic: /left_gripper_controller/controller_state
    right_gripper_cmd_topic: /right_gripper_controller/controller_state

home_mover:
  ros__parameters:
    # `arm` também vem do launch. Startup leva os DOIS braços pra home; depois de
    # cada episódio só o braço ativo (ver home_mover.py).
    left_arm_joint_names:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    right_arm_joint_names:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    # O bringup só spawna os *_forward_position_controller quando sobe com
    # robot_controller:=forward_position_controller — que é obrigatório pro
    # bimanual_teleop, que tem esse tópico fixo no código. Nesse modo os JTC do
    # braço nem existem. Em forward_position o home sai waypoint a waypoint,
    # porque esse controller não interpola: uma mensagem só seria um degrau.
    arm_command_mode: forward_position
    left_arm_cmd_topic: /left_forward_position_controller/commands
    right_arm_cmd_topic: /right_forward_position_controller/commands
    # Pose de home / "ready": cotovelo (joint4) DOBRADO ~57° de propósito — braço
    # reto (tudo 0) fica em singularidade e o IK do teleop não consegue mexer o
    # cotovelo depois. Ordem: joint1..joint7.
    # Medido no dataset gravado (1o frame de cada episodio): left j1=0.962
    # j4=2.208 | right j1=-0.965 j4=2.208. Sao ESTAS as poses que a policy
    # viu no treino -- comecar em outra pose poe as cameras fora da
    # distribuicao e a inferencia degrada.
    left_home_positions:  [1.0, 0.0, 0.0, 2.3, 0.0, 0.0, 0.0]
    right_home_positions: [-1.0, 0.0, 0.0, 2.3, 0.0, 0.0, 0.0]
    move_duration_sec: 4.0
    waypoint_dt: 0.05   # 1 waypoint a cada 50 ms na trajetória de home
    home_on_start: true       # leva pra pose de ready ~4s após subir (sai da singularidade)
    startup_delay_sec: 4.0
    # false: só vai pra home quando o recorder manda (/data_collection/go_home,
    # depois de salvar). true: responde direto ao botão B do XR também (use se
    # rodar o home_mover sem o episode_recorder).
    respond_to_xr_button: true
